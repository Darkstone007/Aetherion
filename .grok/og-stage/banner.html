<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Cinzel;
        src: url("Cinzel.ttf") format("truetype");
        font-weight: 400 900;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 2400px;
        height: 528px;
        overflow: hidden;
        background: #0c0d10;
      }
      .card {
        width: 2400px;
        height: 528px;
        position: relative;
        background: #0c0d10 url("banner-bg.jpg") center / cover no-repeat;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(12, 13, 16, 0.78) 0%,
            rgba(12, 13, 16, 0.42) 34%,
            rgba(12, 13, 16, 0.1) 58%,
            transparent 78%
          ),
          linear-gradient(
            180deg,
            rgba(12, 13, 16, 0.18) 0%,
            transparent 42%,
            rgba(12, 13, 16, 0.5) 100%
          );
      }
      .lockup {
        position: absolute;
        left: 108px;
        top: 54px;
        z-index: 1;
        color: #e8e4d4;
        max-width: 980px;
      }
      .orb {
        width: 22px;
        height: 22px;
        margin-bottom: 22px;
        border-radius: 50%;
        border: 2px solid #6b8f8a;
        background: radial-gradient(circle at 38% 32%, #e8e4d4 0%, #6b8f8a 38%, #0c0d10 72%);
        box-shadow: 0 0 18px rgba(107, 143, 138, 0.65);
      }
      .kicker {
        font-family: Cinzel, "Times New Roman", serif;
        font-weight: 500;
        font-size: 34px;
        letter-spacing: 0.46em;
        line-height: 1;
        text-indent: 0.46em;
        color: #8a8578;
        text-shadow: 0 4px 18px rgba(12, 13, 16, 0.9);
      }
      h1 {
        font-family: Cinzel, "Times New Roman", serif;
        font-weight: 650;
        font-size: 88px;
        letter-spacing: 0.2em;
        line-height: 1;
        text-indent: 0.2em;
        margin-top: 10px;
        text-shadow:
          0 2px 0 rgba(12, 13, 16, 0.6),
          0 8px 32px rgba(12, 13, 16, 0.85);
      }
      .rule {
        width: 168px;
        height: 2px;
        margin: 16px 0 12px;
        background: linear-gradient(90deg, #6b8f8a, transparent);
      }
      .tag {
        font-family: Cinzel, "Times New Roman", serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.4em;
        line-height: 1;
        text-indent: 0.4em;
        color: #8a8578;
        text-shadow: 0 4px 16px rgba(12, 13, 16, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup">
        <div class="orb"></div>
        <div class="kicker">ECHOES OF</div>
        <h1>AETHERION</h1>
        <div class="rule"></div>
        <div class="tag">THE SHATTERED LATTICE</div>
      </div>
    </div>
  </body>
</html>
