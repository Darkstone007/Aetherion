<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Cinzel;
        src: url("Cinzel.ttf") format("truetype");
        font-weight: 400 900;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 2400px;
        height: 1260px;
        overflow: hidden;
        background: #0c0d10;
      }
      .card {
        width: 2400px;
        height: 1260px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0d10 url("bg.jpg") center / cover no-repeat;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 48%,
            rgba(12, 13, 16, 0.28) 0%,
            rgba(12, 13, 16, 0.62) 58%,
            rgba(12, 13, 16, 0.82) 100%
          ),
          linear-gradient(
            180deg,
            rgba(12, 13, 16, 0.5) 0%,
            rgba(12, 13, 16, 0.32) 42%,
            rgba(12, 13, 16, 0.58) 100%
          );
      }
      .lockup {
        position: relative;
        z-index: 1;
        text-align: center;
        color: #e8e4d4;
        width: 58%;
      }
      .orb {
        width: 36px;
        height: 36px;
        margin: 0 auto 52px;
        border-radius: 50%;
        border: 3px solid #6b8f8a;
        background: radial-gradient(circle at 38% 32%, #e8e4d4 0%, #6b8f8a 38%, #0c0d10 72%);
        box-shadow:
          0 0 0 7px rgba(12, 13, 16, 0.55),
          0 0 28px rgba(107, 143, 138, 0.7);
      }
      h1 {
        font-family: Cinzel, "Times New Roman", serif;
        font-weight: 650;
        font-size: 148px;
        letter-spacing: 0.2em;
        line-height: 1;
        text-indent: 0.2em;
        text-shadow:
          0 2px 0 rgba(12, 13, 16, 0.6),
          0 8px 40px rgba(12, 13, 16, 0.85);
      }
      .rule {
        width: 220px;
        height: 2px;
        margin: 40px auto 34px;
        background: linear-gradient(90deg, transparent, #6b8f8a 18%, #6b8f8a 82%, transparent);
      }
      h2 {
        font-family: Cinzel, "Times New Roman", serif;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: 0.46em;
        line-height: 1;
        text-indent: 0.46em;
        color: #8a8578;
        text-shadow: 0 6px 24px rgba(12, 13, 16, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup">
        <div class="orb"></div>
        <h1>AETHERION</h1>
        <div class="rule"></div>
        <h2>VISUAL CODEX</h2>
      </div>
    </div>
  </body>
</html>
